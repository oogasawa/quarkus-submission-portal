apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: submission-portal-proxy
  namespace: submission-portal
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              - name: http-80
                nodePort: 31086
                port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: submission-portal-gateway
  namespace: submission-portal
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: submission-portal-proxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
# Blue/Green switching: adjust weights between unit1 and unit2.
# Default: unit1=100 (Blue active), unit2=0
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: submission-portal-route
  namespace: submission-portal
spec:
  parentRefs:
  - name: submission-portal-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /submission-portal
    backendRefs:
    - name: submission-portal-unit1
      port: 8080
      weight: 100
    - name: submission-portal-unit2
      port: 8080
      weight: 0
