apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-spc-unit1
  namespace: submission-portal
  labels:
    unit: unit1
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "submission-portal-role"
    objects: |
      - objectName: "db-username"
        secretPath: "submission-portal/data/db"
        secretKey: "username"
      - objectName: "db-password"
        secretPath: "submission-portal/data/db"
        secretKey: "password"
