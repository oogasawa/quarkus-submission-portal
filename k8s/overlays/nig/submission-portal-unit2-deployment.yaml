apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-portal-unit2
  namespace: submission-portal
  labels:
    app: submission-portal
    unit: unit2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-portal
      unit: unit2
  template:
    metadata:
      labels:
        app: submission-portal
        unit: unit2
    spec:
      serviceAccountName: submission-portal
      volumes:
      - name: vault-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: submission-portal-spc-unit2
      containers:
      - name: submission-portal
        image: submission-portal
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for vault secrets..."
          while [ ! -f /vault/secrets/oidc-client-secret ]; do sleep 1; done
          while [ ! -f /vault/secrets/s3-access-key ]; do sleep 1; done
          while [ ! -f /vault/secrets/s3-secret-key ]; do sleep 1; done
          while [ ! -f /vault/secrets/db-username ]; do sleep 1; done
          while [ ! -f /vault/secrets/db-password ]; do sleep 1; done
          echo "Vault secrets available"
          export SUBMISSION_PORTAL_OIDC_SECRET=$(cat /vault/secrets/oidc-client-secret)
          export S3_ACCESS_KEY=$(cat /vault/secrets/s3-access-key)
          export S3_SECRET_KEY=$(cat /vault/secrets/s3-secret-key)
          export DB_USER=$(cat /vault/secrets/db-username)
          export DB_PASSWORD=$(cat /vault/secrets/db-password)
          exec java -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -jar /deployments/quarkus-run.jar
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        env:
        - name: DB_URL
          value: "jdbc:postgresql://postgres-unit2:5432/submission_portal"
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: "http://keycloak-unit1.op-account.svc:8080/op-auth/realms/submission"
        - name: S3_ENDPOINT
          value: "http://minio.minio.svc:9000"
        - name: S3_BUCKET
          value: "submission-portal"
        - name: SUBPORTAL_UNLIMITED_USERS
          value: "testadmin,devteam"
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /submission-portal/q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /submission-portal/q/health/ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
